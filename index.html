<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090909"><title>MeGa Games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f7e8bd;font-family:Arial,sans-serif}header{padding:23px 17px;background:linear-gradient(130deg,#251b08,#090909);border-bottom:1px solid #806326}.logo{font-size:29px;font-weight:900;color:#f2c75c}.sub{color:#b8a77b;margin-top:5px}main{max-width:760px;margin:auto;padding:15px}.hero{padding:16px;border:1px solid #806326;border-radius:17px;background:#17130b;margin-bottom:15px}.hero h2{margin:0 0 8px;color:#f4d27a}.tools{display:flex;gap:8px;margin:12px 0}.tools input{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid #806326;background:#171717;color:#fff;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.game{background:#151515;border:1px solid #5b461c;border-radius:15px;padding:13px;color:#f8e7b0;text-align:right;min-height:116px}.game .em{font-size:27px}.game b{display:block;margin:6px 0;font-size:16px}.muted{color:#b6aa8a;font-size:12px}.panel{display:none;background:#121212;border:1px solid #806326;border-radius:17px;padding:15px;margin-top:14px}.panel.active{display:block}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}h3{color:#f4d27a;margin:0 0 12px}button{cursor:pointer;border:0;border-radius:10px;padding:11px 13px;background:#d5a638;color:#171006;font-weight:bold;font-size:14px}.secondary{background:#282319;color:#f6d989;border:1px solid #806326}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:310px;margin:15px auto}.cell{height:82px;font-size:31px;background:#211a0d;color:#f4d27a;border:1px solid #806326}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.memory button{height:62px;font-size:23px;background:#211a0d;color:#f4d27a;border:1px solid #806326}.playarea{min-height:130px;padding:14px;background:#19160f;border-radius:12px;margin:12px 0;text-align:center}.big{font-size:36px}.girl{font-size:54px;text-align:center;margin:8px}.choice{margin:4px}.stat{color:#d9bd76;margin-top:8px}footer{text-align:center;color:#80765f;padding:24px;font-size:12px}
</style></head><body>
<header><div class="logo">♛ MeGa Games</div><div class="sub">20 لعبة مجانية • تعمل بدون إنترنت</div></header>
<main><div class="hero"><h2>أهلاً بك في عالم MeGa</h2><div>ألعاب ألغاز ومغامرات وطبخ وتلبيس وتحديات. اختار لعبة وابدأ اللعب بدون إنترنت.</div><div class="girl">👩🏻‍🎤✨</div></div>
<div class="tools"><input id="search" placeholder="ابحث عن لعبة..." oninput="filterGames()"><button onclick="showHome()">الرئيسية</button></div>
<div id="home"><div class="grid" id="games"></div></div>
<div id="panel" class="panel"><div class="row"><h3 id="gameTitle">اللعبة</h3><button class="secondary" onclick="showHome()">رجوع</button></div><div id="gameBody"></div></div>
</main><footer>MeGa Games © 2026 — ألعاب مصغّرة أصلية أوفلاين</footer>
<script>
const games=[
['xo','⭕','إكس أو','تحدي صديق'],['memory','🧠','اختبار الذاكرة','طابق الرموز'],['rps','✊','حجر ورقة مقص','تحدي الكمبيوتر'],['guess','🔢','خمن الرقم','اكتشف الرقم السري'],
['math','➗','تحدي الحساب','اختبر سرعتك'],['word','🔤','خمن الكلمة','رتب الحروف'],['color','🎨','تحدي الألوان','اختار اللون الصحيح'],['reaction','⚡','سرعة البديهة','اختبر رد فعلك'],
['dress','👗','تلبيس الشخصية','اختار إطلالة'],['makeup','💄','استوديو التجميل','نسق الألوان'],['cooking','🍓','مطبخ ميجا','جهز وصفة'],['pet','🐱','اعتني بالقطة','اهتم بحيوانك'],
['maze','🧩','لغز الاتجاهات','اختر الطريق'],['coin','🪙','تحدي العملة','وجه أم كتابة'],['dice','🎲','رمي النرد','احصل على رقم'],['basket','🏀','تحدي السلة','اختار التصويبة'],
['memory2','🌟','ذاكرة النجوم','تذكر التسلسل'],['riddle','❓','فزورة اليوم','حل اللغز'],['tap','👆','اضغط بسرعة','اجمع النقاط'],['adventure','🏰','مغامرة الأميرة','اختر مسار القصة']
];
const gamesEl=document.getElementById('games');
function renderGames(list=games){gamesEl.innerHTML=list.map(g=>`<button class="game" onclick="openGame('${g[0]}')"><span class="em">${g[1]}</span><b>${g[2]}</b><span class="muted">${g[3]}</span></button>`).join('')}
function filterGames(){let q=document.getElementById('search').value.trim();renderGames(games.filter(g=>g[2].includes(q)||g[3].includes(q)))}
function showHome(){document.getElementById('home').style.display='block';document.getElementById('panel').classList.remove('active')}
function openGame(id){document.getElementById('home').style.display='none';document.getElementById('panel').classList.add('active');let g=games.find(x=>x[0]===id);document.getElementById('gameTitle').textContent=g[1]+' '+g[2];let b=document.getElementById('gameBody');b.innerHTML='';({xo,memory,rps,guess,math,word,color,reaction,dress,makeup,cooking,pet,maze,coin,dice,basket,memory2,riddle,tap,adventure}[id]||(()=>{}))(b)}
function btn(t,fn){let x=document.createElement('button');x.textContent=t;x.onclick=fn;return x}
function say(b,t){let p=document.createElement('div');p.className='stat';p.textContent=t;b.appendChild(p);return p}
let xcells=[],xt='X';
function xo(b){let s=say(b,'دور X');let board=document.createElement('div');board.className='board';let reset=()=>{xcells=Array(9).fill('');xt='X';s.textContent='دور X';board.innerHTML='';xcells.forEach((_,i)=>{let c=btn('',()=>{if(xcells[i])return;xcells[i]=xt;c.textContent=xt;if([[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(a=>a.every(n=>xcells[n]===xt))){s.textContent='الفائز '+xt+' 🎉';board.querySelectorAll('button').forEach(z=>z.disabled=true)}else{xt=xt==='X'?'O':'X';s.textContent=xcells.every(Boolean)?'تعادل':'دور '+xt}});c.className='cell';board.appendChild(c)})};b.append(board,btn('لعبة جديدة',reset));reset()}
function memory(b){let icons=['🍎','🚀','⚽','🎮','🍎','🚀','⚽','🎮','⭐','🎧','⭐','🎧','🐱','🌙','🐱','🌙'];let status=say(b,'اعثر على الأزواج');let area=document.createElement('div');area.className='memory';b.append(area,btn('إعادة اللعب',()=>memoryReset()));function memoryReset(){area.innerHTML='';status.textContent='اعثر على الأزواج';let arr=icons.slice().sort(()=>Math.random()-.5),first=null,lock=false,score=0;arr.forEach(v=>{let c=btn('؟',()=>{if(lock||c.textContent!=='؟')return;c.textContent=v;if(!first){first=c;return}if(first.textContent===c.textContent){first.disabled=c.disabled=true;first=null;score++;status.textContent='الأزواج: '+score;if(score===8)status.textContent='فزت! 🎉'}else{lock=true;let f=first;first=null;setTimeout(()=>{f.textContent='؟';c.textContent='؟';lock=false},650)}});area.append(c)})}memoryReset()}
function rps(b){let p=say(b,'اختار حركتك');['حجر','ورقة','مقص'].forEach(v=>b.append(btn(v,()=>{let c=['حجر','ورقة','مقص'][Math.floor(Math.random()*3)];p.textContent=`أنت ${v} — الكمبيوتر ${c}: `+(v===c?'تعادل':((v==='حجر'&&c==='مقص')||(v==='ورقة'&&c==='حجر')||(v==='مقص'&&c==='ورقة'))?'كسبت!':'خسرت!')})))}
function guess(b){let n=Math.ceil(Math.random()*20),p=say(b,'خمن رقمًا من 1 إلى 20'),i=document.createElement('input');i.type='number';i.placeholder='اكتب رقمك';i.style='padding:12px;width:100%;margin:10px 0';b.append(i,btn('تحقق',()=>p.textContent=+i.value===n?'صح! 🎉':+i.value<n?'الرقم أكبر':'الرقم أصغر'),btn('رقم جديد',()=>{n=1+Math.floor(Math.random()*20);p.textContent='تم اختيار رقم جديد'}))}
function math(b){let a=Math.ceil(Math.random()*20),c=Math.ceil(Math.random()*20),ans=a+c,p=say(b,`${a} + ${c} = ؟`),i=document.createElement('input');i.type='number';i.style='padding:12px';b.append(i,btn('جاوب',()=>p.textContent=+i.value===ans?'إجابة صحيحة 🎉':'حاول مرة أخرى'),btn('سؤال جديد',()=>math(b)))}
function word(b){let words=['قمر','وردة','مدرسة','نجمة','بحر'],w=words[Math.floor(Math.random()*words.length)],p=say(b,'رتب الحروف: '+w.split('').sort(()=>Math.random()-.5).join(' • ')),i=document.createElement('input');i.placeholder='اكتب الكلمة';i.style='padding:12px';b.append(i,btn('تحقق',()=>p.textContent=i.value.trim()===w?'ممتاز!':'حاول مرة أخرى'))}
function color(b){let names=['أحمر','أزرق','أخضر','أصفر'],v=names[Math.floor(Math.random()*4)],p=say(b,'اضغط اسم اللون: '+v);names.slice().sort(()=>Math.random()-.5).forEach(x=>b.append(btn(x,()=>p.textContent=x===v?'صح! 🎉':'حاول مرة أخرى')))}
function reaction(b){let p=say(b,'اضغط ابدأ ثم اضغط الزر عند ظهور الآن'),go=btn('ابدأ',()=>{go.disabled=true;p.textContent='استعد...';setTimeout(()=>{go.textContent='الآن!';go.disabled=false;let t=Date.now();go.onclick=()=>{p.textContent='زمنك '+(Date.now()-t)+' مللي ثانية';go.textContent='إعادة';go.onclick=()=>reaction(b)}},1000+Math.random()*2500)});b.append(go)}
function dress(b){b.innerHTML='<div class="girl" id="avatar">👩🏻‍🎤</div><div class="playarea">اختار الزي والإكسسوارات</div>';let a=b.querySelector('#avatar');['👗','👚','👑','🎀','🕶️','✨'].forEach(v=>b.append(btn(v,()=>a.textContent='👩🏻‍🎤 '+v)))}
function makeup(b){b.innerHTML='<div class="girl" id="face">👩🏻</div><div class="playarea">استوديو التجميل</div>';['💄','🌸','💎','✨','💇🏻‍♀️','👑'].forEach(v=>b.append(btn(v,()=>b.querySelector('#face').textContent='👩🏻 '+v)))}
function cooking(b){let p=say(b,'جهز طبق الفاكهة بالترتيب: 🍓 ثم 🍌 ثم 🍇');let seq=['🍓','🍌','🍇'],n=0;seq.forEach(v=>b.append(btn(v,()=>{if(v===seq[n]){n++;p.textContent=n===3?'الوصفة جاهزة! 🍓🎉':'صح، كمل'}else{n=0;p.textContent='الترتيب غلط، حاول تاني'}})))}
function pet(b){b.innerHTML='<div class="girl" id="pet">🐱</div>';let p=say(b,'قطتك سعيدة!');[['🍖','أكل'],['🧸','لعب'],['🧼','تنظيف'],['💗','حضن']].forEach(([e,t])=>b.append(btn(e+' '+t,()=>{b.querySelector('#pet').textContent='😻';p.textContent='القطة مبسوطة: '+t+'!'})))}
function maze(b){let p=say(b,'أنت في مفترق طرق. اختار طريقًا');['🌳 يسار','🏞️ وسط','🏰 يمين'].forEach((v,i)=>b.append(btn(v,()=>p.textContent=['وجدت نهرًا، حاول تاني','وجدت المفتاح! 🗝️','وصلت للقلعة! فزت 🎉'][i])))}
function coin(b){let p=say(b,'توقع النتيجة');['وجه','كتابة'].forEach(v=>b.append(btn(v,()=>{let r=Math.random()<.5?'وجه':'كتابة';p.textContent='النتيجة '+r+(v===r?' — كسبت!':' — جرب تاني')})))}
function dice(b){let p=say(b,'ارمِ النرد');b.append(btn('🎲 ارمي',()=>p.textContent='النتيجة: '+(1+Math.floor(Math.random()*6))))}
function basket(b){let p=say(b,'اختار قوة التصويبة');['خفيفة','متوسطة','قوية'].forEach((v,i)=>b.append(btn(v,()=>p.textContent=Math.random()>(i===1?.25:.5)?'سلة! 🏀🎉':'ضاعت! حاول تاني')))}
function memory2(b){let seq=[],input=[],p=say(b,'شاهد التسلسل ثم كرره');let start=()=>{seq=Array.from({length:4},()=>['🔴','🔵','🟡','🟢'][Math.floor(Math.random()*4)]);input=[];p.textContent='احفظ: '+seq.join(' ');setTimeout(()=>{p.textContent='كرر التسلسل';['🔴','🔵','🟡','🟢'].forEach(v=>b.append(btn(v,()=>{input.push(v);if(input.length===seq.length)p.textContent=input.join('')===seq.join('')?'ممتاز! 🎉':'لم يطابق، حاول مرة أخرى'})))},1800)};b.append(btn('ابدأ',start))}
function riddle(b){let p=say(b,'ما الشيء الذي له أسنان ولا يعض؟');['المشط','الكتاب','الباب'].forEach(v=>b.append(btn(v,()=>p.textContent=v==='المشط'?'إجابة صحيحة!':'حاول مرة أخرى')))}
function tap(b){let score=0,p=say(b,'اضغط الزر واجمع 20 نقطة');let x=btn('اضغط هنا 👆',()=>{score++;p.textContent='نقاطك: '+score+(score>=20?' — فزت! 🎉':'')});b.append(x)}
function adventure(b){let p=say(b,'الأميرة أمام بوابتين. أي طريق تختار؟');b.append(btn('🌲 الغابة',()=>p.textContent='وجدت صندوقًا مليئًا بالجواهر! 💎'),btn('🏔️ الجبل',()=>p.textContent='وصلت إلى قصر سحري! 👑'))}
renderGames();
</script></body></html>
